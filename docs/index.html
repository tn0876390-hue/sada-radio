<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADA RADIO - إذاعة صدى الذكية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
<h1>📻 SADA RADIO</h1>
<p>تطبيق إذاعي سوداني ذكي + وكيل AI</p>
</header>

<div class="player">
<div class="wave">〰️〰️〰️</div>
<h2 id="nowPlaying">اختر إذاعة من الأسفل</h2>
<audio id="radioPlayer" controls></audio>
<div class="btns">
<button id="playBtn">▶️ شغل</button>
<button id="pauseBtn">⏸️ وقف</button>
</div>
</div>

<div class="stations">
<button onclick="playRadio('https://Qurango.net/radio/tarateel','قرآن ترتيل')">🕋 قرآن ترتيل</button>
<button onclick="playRadio('https://stream.radiojar.com/8s5u5tpdtwzuv','إذاعة السودان')">🇸🇩 إذاعة السودان</button>
<button onclick="playRadio('https://Qurango.net/radio/makkah','إذاعة مكة')">🕋 مكة المكرمة</button>
<button onclick="playRadio('https://n02.radiojar.com/8s5u5tpdtwzuv?rj-tok=AAABl7d5R1EAr5b5p5k5A&rj-ttl=5','راديو شندي')">📍 راديو شندي</button>
</div>

<div class="ai">
<h3>🤖 الوكيل الذكي - نسخ الإذاعة لنص</h3>
<button onclick="startAI()">🎙️ ابدأ النسخ الذكي</button>
<button onclick="stopAI()">⏹️ إيقاف</button>
<p id="aiText">هنا سيظهر النص المنسوخ من الإذاعة...</p>
<button onclick="summarize()">✨ لخص الخبر</button>
<p id="summary"></p>
</div>

<footer>صنع في شندي - SADA RADIO 2026</footer>
</div>
<script src="script.js"></script>
</body>
</html>
